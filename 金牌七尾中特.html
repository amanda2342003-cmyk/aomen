    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    function isValidNum(numStr) {
        let n = parseInt(numStr, 10);
        return !isNaN(n) && n >= 1 && n <= 49;
    }

    function checkWinTail(predictedTails, numTe) {
        if (!isValidNum(numTe)) return false;
        let lastDigit = parseInt(numTe.slice(-1), 10);
        return predictedTails.includes(lastDigit);
    }

    function renderPredictedHtml(predictedTails, numTe, isWin) {
        let lastDigit = isValidNum(numTe) ? parseInt(numTe.slice(-1), 10) : -1;
        let tailsStr = predictedTails.map(t => {
            if (isWin && t === lastDigit) {
                return `<span class="win-tail">${t}</span>`;
            }
            return t;
        }).join('-');

        return `(<span style="color:#000000;">${tailsStr}</span>)`;
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isNotDone = item.numTe === '' || item.numTe === '0' || item.numTe === '00';
                if (!isNotDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictTailsForKy(item.kyNum);
                let isWin = checkWinTail(predicted, item.numTe);
                evaluatedDoneList.push({ item, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictTailsForKy(nextKyNum).join('-');
            let kyStrNext = formatThreeDigits(nextKyNum);

            // Chữ 准 ở kỳ chờ mở thưởng được bao quanh bởi thẻ style màu đen #000000
            let htmlNextKy = `<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStrNext}期<span style="color:#0000FF;">七尾中特</span>(<span style="color:#000000;">${predictNext}</span>)开:<span style="color:#FF0000;">？00</span><span style="color:#000000;">准</span></p>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let evalItem = evaluatedDoneList[i];
                    let item = evalItem.item;
                    let predicted = getPredictTailsForKy(item.kyNum);
                    let animal = duLieuMap[item.numTe] || '';

                    if (evalItem.isWin) {
                        // Tách riêng chữ 准 ra màu đen #000000, phần con giáp + số mở thưởng giữ màu đỏ #FF0000
                        let resStrWin = `<span style="color:#FF0000;">${animal}${item.numTe}</span><span style="color:#000000;">准</span>`;
                        let kyStr = formatThreeDigits(item.kyNum);
                        let formattedPredictHtml = renderPredictedHtml(predicted, item.numTe, evalItem.isWin);
                        historyOutputs.push(`<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStr}期<span style="color:#0000FF;">七尾中特</span>${formattedPredictHtml}开:${resStrWin}</p>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let predict1 = getPredictTailsForKy(nextKyNum + 1).join('-');
                let predict2 = getPredictTailsForKy(nextKyNum + 2).join('-');
                let defaultHtml1 = `<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStr1}期<span style="color:#0000FF;">七尾中特</span>(<span style="color:#000000;">${predict1}</span>)开:<span style="color:#FF0000;">？00</span><span style="color:#000000;">准</span></p>`;
                let defaultHtml2 = `<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStr2}期<span style="color:#0000FF;">七尾中特</span>(<span style="color:#000000;">${predict2}</span>)开:<span style="color:#FF0000;">？00</span><span style="color:#000000;">准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let predictExtra = getPredictTailsForKy(nextKyNum + 1).join('-');
                let defaultHtmlExtra = `<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStrExtra}期<span style="color:#0000FF;">七尾中特</span>(<span style="color:#000000;">${predictExtra}</span>)开:<span style="color:#FF0000;">？00</span><span style="color:#000000;">准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>

</body>
</html>
