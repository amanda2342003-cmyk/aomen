    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictDanShuangForKy(kyNum) {
        if (STATIC_PREDICTIONS[kyNum]) {
            return STATIC_PREDICTIONS[kyNum];
        }
        let cycle = Math.floor((kyNum - 1) / 2);
        return cycle % 2 === 0 ? "天肖+鸡蛇" : "地肖+兔马";
    }

    function getDanShuangByNum(numStr, animal) {
        if (TIAN_XIAO.includes(animal)) return "天肖";
        if (DI_XIAO.includes(animal)) return "地肖";
        return "";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    function checkWin(predicted, animal) {
        if (!animal) return false;
        let parts = predicted.split('+');
        let mainCat = parts[0];
        let subZodiacs = parts[1] || '';
        
        let actualCat = getDanShuangByNum('', animal);
        if (subZodiacs.includes(animal)) return true;
        if (mainCat === actualCat) return true;
        return false;
    }

    function renderPredictedHtml(predicted, animal, isWin) {
        let parts = predicted.split('+');
        let mainCat = parts[0];
        let subZodiacs = parts[1] || '';
        let actualCat = getDanShuangByNum('', animal);

        let mainCatHtml = mainCat;
        let subZodiacsHtml = subZodiacs;

        if (isWin) {
            let hitSubZodiac = subZodiacs && subZodiacs.includes(animal);

            if (hitSubZodiac) {
                let z1 = subZodiacs.charAt(0);
                let z2 = subZodiacs.charAt(1);
                let z1Html = (z1 === animal) ? `<span class="win-animal">${z1}</span>` : z1;
                let z2Html = (z2 === animal) ? `<span class="win-animal">${z2}</span>` : z2;
                subZodiacsHtml = z1Html + z2Html;
            } else if (mainCat === actualCat) {
                mainCatHtml = `<span class="win-animal">${mainCat}</span>`;
            }
        }

        return `【${mainCatHtml}+${subZodiacsHtml}】`;
    }

        try {

                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';

                        }
                    }

                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined && String(r[7].v).trim() !== '') {
                        numTeFormatted = formatTwoDigits(r[7].v);
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isNotDone = item.numTe === '' || item.numTe === '0' || item.numTe === '00';
                if (!isNotDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictDanShuangForKy(item.kyNum);
                let animal = duLieuMap[item.numTe] || '';
                let isValidNum = duLieuMap.hasOwnProperty(item.numTe);
                let isWin = isValidNum && checkWin(predicted, animal);
                evaluatedDoneList.push({ item, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictDanShuangForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p style="height:33px;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400;">${kyStrNext}期:天地生肖【${predictNext}】开？00对</p>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let evalItem = evaluatedDoneList[i];
                    let item = evalItem.item;
                    let predicted = getPredictDanShuangForKy(item.kyNum);
                    let shengXiaoWin = duLieuMap[item.numTe] || '';
                    let animal = shengXiaoWin;

                    if (evalItem.isWin) {
                        let resStrWin = shengXiaoWin + item.numTe + '对';
                        let kyStr = formatThreeDigits(item.kyNum);
                        let formattedPredictHtml = renderPredictedHtml(predicted, animal, evalItem.isWin);
                        historyOutputs.push(`<p style="height:33px;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400;">${kyStr}期:天地生肖${formattedPredictHtml}开${resStrWin}</p>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="height:33px;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400;">${kyStr1}期:天地生肖【發發+發發】开？00对</p>`;
                let defaultHtml2 = `<p style="height:33px;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400;">${kyStr2}期:天地生肖【發發+發發】开？00对</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="height:33px;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400;">${kyStrExtra}期:天地生肖【發發+發發】开？00对</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>
