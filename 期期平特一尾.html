    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        return STATIC_PREDICTIONS[actualKy] || "0尾0尾0尾";
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function formatThreeDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '001';
        return String(num).padStart(3, '0');
    }

    async function initPredict() {
        try {
            // Lấy dữ liệu map số -> con giáp từ sheet DULIEU
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    // Thứ tự ưu tiên: Cột 7 (Giải ĐB) -> Cột 1 đến 6 (Giải 1 -> 6)
                    let orderedColumns = [7, 1, 2, 3, 4, 5, 6];
                    let numbersInDraw = [];

                    for (let colIdx of orderedColumns) {
                        if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
                            let valStr = String(r[colIdx].v).trim();
                            if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                                let formatted = formatTwoDigits(valStr);
                                if (formatted) {
                                    numbersInDraw.push(formatted);
                                }
                            }
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            drawNumbers: numbersInDraw
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.drawNumbers && item.drawNumbers.length > 0;
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictForKy(item.kyNum);
                let targetTail = predicted[0];
                let isWin = false;
                let winNumber = "";
                let winAnimal = "";

                // Ưu tiên kiểm tra từ Giải ĐB -> Giải 6
                for (let numStr of item.drawNumbers) {
                    let numInt = parseInt(numStr, 10);
                    // Chỉ xét các số trong phạm vi từ 01 đến 49 (1 -> 49)
                    if (numInt >= 1 && numInt <= 49) {
                        let lastDigit = numStr.slice(-1);
                        if (lastDigit === targetTail) {
                            isWin = true;
                            winNumber = numStr;
                            winAnimal = duLieuMap[numStr] || '';
                            break;
                        }
                    }
                }
                
                evaluatedDoneList.push({ item, isWin, predicted, targetTail, winNumber, winAnimal });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = formatThreeDigits(nextKyNum);

            let htmlNextKy = `<p style="font-weight:bold;">${kyStrNext}期:<span style="color:#0066FF;">平特一尾</span>【<span style="color:#339966;">${predictNext}</span>】开:？00准</p>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let evalItem = evaluatedDoneList[i];
                    let item = evalItem.item;

                    if (evalItem.isWin) {
                        let predicted = getPredictForKy(item.kyNum);
                        let kyStr = formatThreeDigits(item.kyNum);
                        let resStrWin = evalItem.winAnimal + evalItem.winNumber;

                        let formattedPredictHtml = `<span class="win-animal">${predicted}</span>`;
                        historyOutputs.push(`<p style="font-weight:bold;">${kyStr}期:<span style="color:#0066FF;">平特一尾</span>【${formattedPredictHtml}】开:${resStrWin}准</p>`);
                    }
                }
            }

            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = formatThreeDigits(nextKyNum + 1);
                let kyStr2 = formatThreeDigits(nextKyNum + 2);
                let defaultHtml1 = `<p style="font-weight:bold;">${kyStr1}期:<span style="color:#0066FF;">平特一尾</span>【<span style="color:#339966;">$尾$尾$尾</span>】开:？00准</p>`;
                let defaultHtml2 = `<p style="font-weight:bold;">${kyStr2}期:<span style="color:#0066FF;">平特一尾</span>【<span style="color:#339966;">$尾$尾$尾</span>】开:？00准</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = formatThreeDigits(nextKyNum + 1);
                let defaultHtmlExtra = `<p style="font-weight:bold;">${kyStrExtra}期:<span style="color:#0066FF;">平特一尾</span>【<span style="color:#339966;">$尾$尾$尾</span>】开:？00准</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
