    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error(" ");
            });
    }

    function getPredictForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        if (STATIC_PREDICTIONS[actualKy]) {
            return STATIC_PREDICTIONS[actualKy];
        }
        return "蓝波红波";
    }

    function checkGroupHit(numStr, groupName) {
        let clean = String(numStr).replace(/\D/g, '');
        if (!clean) return false;
        let n = parseInt(clean, 10);
        if (isNaN(n)) return false;
        return WAVE_GROUPS[groupName] ? WAVE_GROUPS[groupName].includes(n) : false;
    }

    function formatTwoDigits(val) {
        let cleanVal = String(val).trim();
        let num = parseInt(cleanVal.replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    function renderPredictionHtml(predStr, hitNum = '') {
        let items = predStr.match(/.{1,2}/g) || [];
        return items.map(grp => {
            if (hitNum && checkGroupHit(hitNum, grp)) {
                return `【<span class="win-animal">${grp}</span>】`;
            } else {
                return `【${grp}】`;
            }
        }).join('');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);

                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';

                        }
                    }

            const rawKQ = await fetchJSONP(URL_KQ);

                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(valStr);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '' && item.numTe !== '00';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predicted = getPredictForKy(item.kyNum);
                let isValidNum = duLieuMap.hasOwnProperty(item.numTe);
                
                let isWin = false;
                if (isValidNum) {
                    let items = predicted.match(/.{1,2}/g) || [];
                    isWin = items.some(grp => checkGroupHit(item.numTe, grp));
                }

                evaluatedDoneList.push({ item, predicted, isWin });
            }

            let checkLatestMisses = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestMisses++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestMisses < 3) {
                let consecutiveMisses = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveMisses++;
                        if (consecutiveMisses >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveMisses = 0;
                    }
                }
            } else {
                cutoffIndex = evaluatedDoneList.length;
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = `<p style="margin:0px;">${kyStrNext}期：特码波路${renderPredictionHtml(predictNext)}开:<span style="color:#FF00FF;">？00准</span></p>`;

            let historyOutputs = [];
            if (checkLatestMisses < 3) {
                for (let i = cutoffIndex; i < evaluatedDoneList.length; i++) {
                    let entry = evaluatedDoneList[i];
                    if (entry.isWin) {
                        let shengXiaoWin = duLieuMap[entry.item.numTe] || '';
                        let resStrWin = shengXiaoWin + entry.item.numTe;
                        let kyStr = String(entry.item.kyNum).padStart(3, '0');
                        let formattedPredictHtml = renderPredictionHtml(entry.predicted, entry.item.numTe);

                        historyOutputs.push(`<p style="margin:0px;">${kyStr}期：特码波路${formattedPredictHtml}开:<span style="color:#FF00FF;">${resStrWin}准</span></p>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<p style="margin:0px;">${kyStr1}期：特码波路【發發】【發發】开:<span style="color:#FF00FF;">？00准</span></p>`;
                let defaultHtml2 = `<p style="margin:0px;">${kyStr2}期：特码波路【發發】【發發】开:<span style="color:#FF00FF;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<p style="margin:0px;">${kyStrExtra}期：特码波路【發發】【發發】开:<span style="color:#FF00FF;">？00准</span></p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
