 192: "一段", 193: "三段", 194: "七段", 195: "二段", 196: "五段", 197: "四段", 198: "三段", 199: "七段", 200: "二段", 201: "四段", 202: "六段", 203: "三段", 204: "二段", 205: "五段", 206: "七段", 207: "六段", 208: "三段", 209: "四段", 210: "七段", 211: "五段", 212: "二段", 213: "一段", 214: "六段", 215: "五段", 216: "二段", 217: "七段", 218: "三段", 219: "六段", 220: "四段", 221: "二段", 222: "三段", 223: "七段", 224: "五段", 225: "六段", 226: "一段", 227: "三段", 228: "四段", 229: "六段", 230: "五段", 231: "一段", 232: "三段", 233: "四段", 234: "二段", 235: "五段", 236: "七段", 237: "一段", 238: "三段", 239: "四段", 240: "六段", 241: "七段", 242: "二段", 243: "三段", 244: "四段", 245: "六段", 246: "七段", 247: "三段", 248: "四段", 249: "五段", 250: "七段", 251: "二段", 252: "六段", 253: "一段", 254: "五段", 255: "三段", 256: "七段", 257: "四段", 258: "五段", 259: "二段", 260: "六段", 261: "四段", 262: "三段", 263: "二段", 264: "六段", 265: "四段", 266: "三段", 267: "七段", 268: "二段", 269: "六段", 270: "一段", 271: "五段", 272: "七段", 273: "四段", 274: "一段", 275: "六段", 276: "三段", 277: "二段", 278: "五段", 279: "六段", 280: "一段", 281: "三段", 282: "七段", 283: "二段", 284: "六段", 285: "三段", 286: "一段", 287: "七段", 288: "四段", 289: "六段", 290: "三段", 291: "五段", 292: "七段", 293: "四段", 294: "三段", 295: "一段", 296: "五段", 297: "二段", 298: "三段", 299: "六段", 300: "五段", 301: "四段", 302: "六段", 303: "三段", 304: "七段", 305: "四段", 306: "二段", 307: "一段", 308: "六段", 309: "七段", 310: "五段", 311: "三段", 312: "二段", 313: "六段", 314: "一段", 315: "四段", 316: "七段", 317: "五段", 318: "六段", 319: "一段", 320: "七段", 321: "三段", 322: "四段", 323: "二段", 324: "一段", 325: "三段", 326: "四段", 327: "七段", 328: "一段", 329: "五段", 330: "三段", 331: "六段", 332: "二段", 333: "七段", 334: "三段", 335: "一段", 336: "二段", 337: "六段", 338: "五段", 339: "四段", 340: "三段", 341: "七段", 342: "一段", 343: "六段", 344: "四段", 345: "二段", 346: "三段", 347: "六段", 348: "七段", 349: "一段", 350: "四段", 351: "三段", 352: "五段", 353: "二段", 354: "一段", 355: "四段", 356: "三段", 357: "七段", 358: "一段", 359: "六段", 360: "三段", 361: "四段", 362: "七段", 363: "一段", 364: "六段", 365: "五段", 366: "四段"
    };

    function fetchJSONP(url) {
        return fetch(url)
            .then(res => res.text())
            .then(text => {
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
                if (match && match[1]) return JSON.parse(match[1]);
                throw new Error("Invalid response");
            });
    }

    function getPredictDuanForKy(kyNum) {
        let actualKy = ((kyNum - 1) % 366) + 1;
        return STATIC_PREDICTIONS[actualKy] || "一段";
    }

    function formatTwoDigits(val) {
        let num = parseInt(String(val).replace(/\D/g, ''), 10);
        if (isNaN(num)) return '';
        return String(num).padStart(2, '0');
    }

    async function initPredict() {
        try {
            const rawRules = await fetchJSONP(URL_DULIEU);
            if (rawRules.table && rawRules.table.rows) {
                rawRules.table.rows.forEach(r => {
                    if (r.c && r.c[0] && r.c[0].v !== null && r.c[0].v !== undefined) {
                        let formattedNum = formatTwoDigits(r.c[0].v);
                        let animal = (r.c[1] && r.c[1].v !== null && r.c[1].v !== undefined) ? String(r.c[1].v).trim() : '';
                        if (formattedNum && animal) {
                            duLieuMap[formattedNum] = animal;
                        }
                    }
                });
            }

            const rawKQ = await fetchJSONP(URL_KQ);
            const rows = rawKQ.table.rows;
            let parsedList = [];

            if (rows) {
                for (let i = 0; i < rows.length; i++) {
                    const r = rows[i].c;
                    if (!r || !r[0] || r[0].v === null || r[0].v === undefined) continue;
                    
                    let kyRaw = String(r[0].v).trim();
                    let kyOnlyNum = parseInt(kyRaw.replace(/\D/g, ''), 10) || 0;
                    
                    let numTeFormatted = '';
                    if (r[7] && r[7].v !== null && r[7].v !== undefined) {
                        let valStr = String(r[7].v).trim();
                        if (valStr !== '' && valStr !== '0' && valStr !== '00') {
                            numTeFormatted = formatTwoDigits(r[7].v);
                        }
                    }

                    if (kyOnlyNum > 0) {
                        parsedList.push({
                            kyNum: kyOnlyNum,
                            numTe: numTeFormatted
                        });
                    }
                }
            }

            let doneList = [];
            let pendingKyObj = null;

            for (let i = 0; i < parsedList.length; i++) {
                let item = parsedList[i];
                let isDone = item.numTe !== '';
                if (isDone) {
                    doneList.push(item);
                } else {
                    pendingKyObj = item;
                }
            }

            let targetPredictKy = 1;
            if (pendingKyObj) {
                targetPredictKy = pendingKyObj.kyNum;
            } else if (doneList.length > 0) {
                targetPredictKy = doneList[doneList.length - 1].kyNum + 1;
            }

            let evaluatedDoneList = [];
            for (let i = 0; i < doneList.length; i++) {
                let item = doneList[i];
                let predictedDuan = getPredictDuanForKy(item.kyNum);
                let actualNum = parseInt(item.numTe, 10);
                
                // Trúng (isWin) khi số mở thưởng KHÔNG nằm trong danh sách số của Đoạn được dự đoán (绝杀)
                let killNumbers = DUAN_MAP[predictedDuan] || [];
                let isWin = !isNaN(actualNum) && !killNumbers.includes(actualNum);

                evaluatedDoneList.push({ item, isWin });
            }

            let checkLatestDeletes = 0;
            for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                if (!evaluatedDoneList[i].isWin) {
                    checkLatestDeletes++;
                } else {
                    break;
                }
            }

            let cutoffIndex = 0;
            if (checkLatestDeletes >= 3) {
                cutoffIndex = evaluatedDoneList.length;
            } else {
                let consecutiveDeletes = 0;
                for (let i = evaluatedDoneList.length - 1; i >= 0; i--) {
                    if (!evaluatedDoneList[i].isWin) {
                        consecutiveDeletes++;
                        if (consecutiveDeletes >= 3) {
                            cutoffIndex = i + 1;
                            break;
                        }
                    } else {
                        consecutiveDeletes = 0;
                    }
                }
            }

            let nextKyNum = targetPredictKy;
            let predictNext = getPredictDuanForKy(nextKyNum);
            let kyStrNext = String(nextKyNum).padStart(3, '0');

            let htmlNextKy = `<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStrNext}期:<span style="color:#FF0000;">绝杀一段</span>【<span style="color:#0000FF;">${predictNext}</span>】开:<span style="color:#008000;">？00</span>中</p>`;

            let historyOutputs = [];
            if (checkLatestDeletes < 3) {
                for (let i = cutoffIndex; i < doneList.length; i++) {
                    let item = doneList[i];
                    let evaluated = evaluatedDoneList.find(e => e.item.kyNum === item.kyNum);
                    if (evaluated && evaluated.isWin) {
                        let predicted = getPredictDuanForKy(item.kyNum);
                        let shengXiaoWin = duLieuMap[item.numTe] || '';
                        let resStrWin = shengXiaoWin + item.numTe;
                        let kyStr = String(item.kyNum).padStart(3, '0');
                        historyOutputs.push(`<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStr}期:<span style="color:#FF0000;">绝杀一段</span>【<span style="color:#0000FF;">${predicted}</span>】开:<span style="color:#008000;">${resStrWin}</span>中</p>`);
                    }
                }
            }
            historyOutputs.reverse();

            let finalOutputs = [htmlNextKy, ...historyOutputs];

            let currentCount = finalOutputs.length;
            if (currentCount === 1) {
                let kyStr1 = String(nextKyNum + 1).padStart(3, '0');
                let kyStr2 = String(nextKyNum + 2).padStart(3, '0');
                let defaultHtml1 = `<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStr1}期:<span style="color:#FF0000;">绝杀一段</span>【<span style="color:#0000FF;">發發</span>】开:<span style="color:#008000;">？00</span>中</p>`;
                let defaultHtml2 = `<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStr2}期:<span style="color:#FF0000;">绝杀一段</span>【<span style="color:#0000FF;">發發</span>】开:<span style="color:#008000;">？00</span>中</p>`;
                finalOutputs.unshift(defaultHtml1);
                finalOutputs.unshift(defaultHtml2);
            } else if (currentCount === 2) {
                let kyStrExtra = String(nextKyNum + 1).padStart(3, '0');
                let defaultHtmlExtra = `<p style="font-family:'Microsoft YaHei',微,sans-serif;font-weight:bold;line-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">${kyStrExtra}期:<span style="color:#FF0000;">绝杀一段</span>【<span style="color:#0000FF;">發發</span>】开:<span style="color:#008000;">？00</span>中</p>`;
                finalOutputs.unshift(defaultHtmlExtra);
            }

            document.getElementById('content-container').innerHTML = finalOutputs.join('');

        } catch (err) {
            console.error(err);
            document.getElementById('content-container').innerHTML = ' ';
        }
    }
    initPredict();
</script>
